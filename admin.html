<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>التقارير — لوحة المدير</title>
<link rel="stylesheet" href="style.css">
</head>
<body>

<!-- شاشة الدخول -->
<div id="loginScreen" class="login-screen">
  <div class="login-card">
    <div class="login-icon">🔐</div>
    <h2>الدخول إلى لوحة المدير</h2>
    <p>مختبر مستشفى سبت العلاية</p>
    <input type="password" id="pwd" placeholder="أدخل كلمة المرور" autocomplete="current-password">
    <button onclick="checkPwd()" class="btn-primary">دخول</button>
    <p id="loginErr" class="status err" style="display:none;"></p>
  </div>
</div>

<!-- اللوحة -->
<div id="adminPanel" style="display:none;">
  <header class="topbar">
    <div class="topbar-inner">
      <div class="brand">
        <span class="brand-icon">📊</span>
        <div class="brand-text">
          <h1>إدارة التقارير</h1>
          <p>مختبر مستشفى سبت العلاية</p>
        </div>
      </div>
      <a href="index.html" class="icon-btn" title="رجوع">↩️</a>
    </div>
  </header>

  <main class="container">

    <div class="stats-bar" id="statsBar">
      <div class="stat"><span class="stat-num" id="statTotal">0</span><span class="stat-label">الإجمالي</span></div>
      <div class="stat new"><span class="stat-num" id="statNew">0</span><span class="stat-label">جديد</span></div>
      <div class="stat prog"><span class="stat-num" id="statProg">0</span><span class="stat-label">قيد المعالجة</span></div>
      <div class="stat done"><span class="stat-num" id="statDone">0</span><span class="stat-label">مكتمل</span></div>
    </div>

    <div class="filters">
      <input type="text" id="search" placeholder="🔎 بحث بالاسم أو التفاصيل..." oninput="render()">
      <select id="filterType" onchange="render()">
        <option value="">كل الأنواع</option>
        <option>تقرير يومي</option>
        <option>صيانة جهاز</option>
        <option>نقص مواد</option>
        <option>مشكلة طارئة</option>
        <option>ملاحظة عامة</option>
        <option>طلب إجازة</option>
      </select>
      <select id="filterStatus" onchange="render()">
        <option value="">كل الحالات</option>
        <option>جديد</option>
        <option>قيد المعالجة</option>
        <option>مكتمل</option>
      </select>
      <button onclick="loadData()" class="btn-primary small">🔄 تحديث</button>
      <button onclick="exportCSV()" class="btn-success small">📥 تصدير CSV</button>
    </div>

    <div id="loading" class="status">⏳ جاري تحميل التقارير...</div>

    <div id="cardsList" class="report-cards"></div>

  </main>
</div>

<script>
  const PASSWORD = "Ss@123456";
  const API_URL = "https://script.google.com/macros/s/XXXXXXXXXXXX/exec";
  const API_KEY = "Ss@123456";

  let allData = [];

  function checkPwd() {
    const val = document.getElementById("pwd").value;
    if (val === PASSWORD) {
      sessionStorage.setItem("labAdminAuth", "1");
      showPanel();
    } else {
      const err = document.getElementById("loginErr");
      err.textContent = "❌ كلمة المرور غير صحيحة";
      err.style.display = "block";
    }
  }

  function showPanel() {
    document.getElementById("loginScreen").style.display = "none";
    document.getElementById("adminPanel").style.display = "block";
    loadData();
  }

  // إعادة الدخول تلقائيًا في نفس الجلسة
  if (sessionStorage.getItem("labAdminAuth") === "1") showPanel();

  async function loadData() {
    document.getElementById("loading").style.display = "block";
    try {
      const res = await fetch(`${API_URL}?key=${encodeURIComponent(API_KEY)}`);
      const json = await res.json();
      if (json.status === "ok") {
        allData = json.data;
        render();
      } else if (json.status === "unauthorized") {
        alert("انتهت الجلسة أو كلمة المرور غير صحيحة");
      }
    } catch (e) {
      alert("تعذر جلب البيانات: " + e.message);
    } finally {
      document.getElementById("loading").style.display = "none";
    }
  }

  function getStatus(r) { return r["الحالة"] || "جديد"; }

  function render() {
    const q = document.getElementById("search").value.trim();
    const type = document.getElementById("filterType").value;
    const status = document.getElementById("filterStatus").value;

    const filtered = allData.filter(r => {
      const name = r["اسم الموظف"] || "";
      const details = r["التفاصيل"] || "";
      const matchQ = !q || (name + details).includes(q);
      const matchT = !type || r["نوع التقرير"] === type;
      const matchS = !status || getStatus(r) === status;
      return matchQ && matchT && matchS;
    });

    // الإحصائيات
    document.getElementById("statTotal").textContent = allData.length;
    document.getElementById("statNew").textContent = allData.filter(r => getStatus(r) === "جديد").length;
    document.getElementById("statProg").textContent = allData.filter(r => getStatus(r) === "قيد المعالجة").length;
    document.getElementById("statDone").textContent = allData.filter(r => getStatus(r) === "مكتمل").length;

    const container = document.getElementById("cardsList");
    if (filtered.length === 0) {
      container.innerHTML = `<p class="status">لا توجد تقارير مطابقة</p>`;
      return;
    }

    container.innerHTML = filtered.map(r => {
      const s = getStatus(r);
      const priorityClass = (r["الأولوية"] || "عادي").replace(/\s/g, "");
      const attachment = r["المرفق"]
        ? `<a href="${r["المرفق"]}" target="_blank" class="attach-link">📎 فتح المرفق</a>`
        : "";

      return `
        <div class="report-card">
          <div class="report-header">
            <div>
              <h3>${escapeHtml(r["اسم الموظف"] || "—")}</h3>
              <p class="report-meta">${escapeHtml(r["القسم"] || "")} • ${escapeHtml(r["نوع التقرير"] || "")}</p>
            </div>
            <div class="report-badges">
              <span class="badge priority-${priorityClass}">${escapeHtml(r["الأولوية"] || "عادي")}</span>
              <span class="badge status-${s.replace(/\s/g,"")}">${escapeHtml(s)}</span>
            </div>
          </div>

          <p class="report-details">${escapeHtml(r["التفاصيل"] || "")}</p>

          <div class="report-footer">
            <span class="report-date">📅 ${escapeHtml(r["التاريخ"] || "")} — ${escapeHtml(r["الوقت"] || "")}</span>
            <div class="report-actions">
              ${attachment}
              <select onchange="updateStatus(${r._row}, this.value, this)" class="status-select">
                <option ${s==="جديد"?"selected":""}>جديد</option>
                <option ${s==="قيد المعالجة"?"selected":""}>قيد المعالجة</option>
                <option ${s==="مكتمل"?"selected":""}>مكتمل</option>
              </select>
              <button onclick='shareWhatsapp(${JSON.stringify(JSON.stringify(r))})' class="icon-action" title="مشاركة واتساب">📲</button>
            </div>
          </div>
        </div>
      `;
    }).join("");
  }

  async function updateStatus(row, status, el) {
    el.disabled = true;
    try {
      const res = await fetch(API_URL, {
        method: "POST",
        body: JSON.stringify({ key: API_KEY, row: row, status: status, _method: "PUT" }),
        headers: { "Content-Type": "text/plain" }
      });
      // Apps Script ما يدعم PUT فعليًا، نستخدم POST مع _method
      const json = await res.json();
      if (json.status === "ok") {
        const item = allData.find(r => r._row === row);
        if (item) item["الحالة"] = status;
        render();
      } else {
        alert("فشل تحديث الحالة");
      }
    } catch (e) {
      alert("خطأ في الاتصال: " + e.message);
    } finally {
      el.disabled = false;
    }
  }

  function shareWhatsapp(jsonStr) {
    const r = JSON.parse(jsonStr);
    const text =
      `📋 تقرير جديد\n` +
      `👤 الموظف: ${r["اسم الموظف"]}\n` +
      `🧪 القسم: ${r["القسم"]}\n` +
      `📌 النوع: ${r["نوع التقرير"]}\n` +
      `⚡ الأولوية: ${r["الأولوية"]}\n` +
      `📝 التفاصيل: ${r["التفاصيل"]}\n` +
      `📅 ${r["التاريخ"]} — ${r["الوقت"]}`;
    window.open(`https://wa.me/?text=${encodeURIComponent(text)}`, "_blank");
  }

  function exportCSV() {
    const headers = ["التاريخ","الوقت","اسم الموظف","القسم","نوع التقرير","الأولوية","التفاصيل","الحالة"];
    const rows = allData.map(r => headers.map(h => `"${(r[h]||"").toString().replace(/"/g,'""')}"`).join(","));
    const csv = "\uFEFF" + headers.join(",") + "\n" + rows.join("\n");
    const blob = new Blob([csv], { type: "text/csv;charset=utf-8;" });
    const a = document.createElement("a");
    a.href = URL.createObjectURL(blob);
    a.download = `lab-reports-${new Date().toISOString().slice(0,10)}.csv`;
    a.click();
  }

  function escapeHtml(str) {
    return String(str).replace(/[&<>"']/g, c => ({
      "&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"
    }[c]));
  }
</script>
</body>
</html>
