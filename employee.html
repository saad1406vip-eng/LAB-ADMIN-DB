<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>إرسال تقرير — لوحة المدير الشاملة</title>
<link rel="manifest" href="manifest.json">
<link rel="stylesheet" href="style.css">
</head>
<body>

<header class="topbar">
  <div class="topbar-inner">
    <div class="brand">
      <span class="brand-icon">📝</span>
      <div class="brand-text">
        <h1>إرسال تقرير جديد</h1>
        <p>مختبر مستشفى سبت العلاية</p>
      </div>
    </div>
    <a href="index.html" class="icon-btn" title="رجوع">↩️</a>
  </div>
</header>

<main class="container-narrow">
  <form id="reportForm" class="form-card">

    <div class="form-group">
      <label>👨‍🔬 اسم الموظف</label>
      <input type="text" name="name" required placeholder="اكتب اسمك الكامل">
    </div>

    <div class="form-group">
      <label>🧪 القسم</label>
      <select name="department" required>
        <option value="">— اختر القسم —</option>
        <option>الكيمياء</option>
        <option>الهيماتولوجي</option>
        <option>الأحياء الدقيقة</option>
        <option>الأمصال</option>
        <option>الهرمونات</option>
        <option>سحب العينات</option>
        <option>الاستقبال</option>
        <option>أخرى</option>
      </select>
    </div>

    <div class="form-group">
      <label>📋 نوع التقرير</label>
      <select name="reportType" required>
        <option value="">— اختر النوع —</option>
        <option>تقرير يومي</option>
        <option>صيانة جهاز</option>
        <option>نقص مواد</option>
        <option>مشكلة طارئة</option>
        <option>ملاحظة عامة</option>
        <option>طلب إجازة</option>
      </select>
    </div>

    <div class="form-group">
      <label>⚡ الأولوية</label>
      <div class="radio-group">
        <label class="radio"><input type="radio" name="priority" value="عادي" checked> <span>عادي</span></label>
        <label class="radio"><input type="radio" name="priority" value="مهم"> <span>مهم</span></label>
        <label class="radio"><input type="radio" name="priority" value="عاجل"> <span>عاجل</span></label>
      </div>
    </div>

    <div class="form-group">
      <label>📝 التفاصيل</label>
      <textarea name="details" required placeholder="اكتب تفاصيل التقرير بوضوح..."></textarea>
    </div>

    <div class="form-group">
      <label>📎 إرفاق ملف (اختياري — صورة أو PDF)</label>
      <input type="file" id="attachment" accept="image/*,.pdf">
      <small class="hint">الحد الأقصى: 5 ميجابايت</small>
    </div>

    <button type="submit" class="btn-primary" id="submitBtn">📤 إرسال التقرير</button>
    <div id="status" class="status"></div>
  </form>
</main>

<footer class="footer">
  <p>© وزارة الصحة — تجمع عسير الصحي — مختبر مستشفى سبت العلاية</p>
</footer>

<script>
  // 🔴 ضع رابط Apps Script هنا
  const API_URL = "https://script.google.com/macros/s/XXXXXXXXXXXX/exec";

  const form = document.getElementById("reportForm");
  const statusEl = document.getElementById("status");
  const submitBtn = document.getElementById("submitBtn");

  // ========== IndexedDB ==========
  const DB_NAME = "lab_pending_reports";
  function openDB() {
    return new Promise((resolve, reject) => {
      const req = indexedDB.open(DB_NAME, 1);
      req.onupgradeneeded = () => {
        req.result.createObjectStore("pending", { keyPath: "id", autoIncrement: true });
      };
      req.onsuccess = () => resolve(req.result);
      req.onerror = () => reject(req.error);
    });
  }

  async function saveLocal(data) {
    const db = await openDB();
    return new Promise((resolve) => {
      const tx = db.transaction("pending", "readwrite");
      tx.objectStore("pending").add(data);
      tx.oncomplete = resolve;
    });
  }

  async function getPending() {
    const db = await openDB();
    return new Promise((resolve) => {
      const tx = db.transaction("pending", "readonly");
      const req = tx.objectStore("pending").getAll();
      req.onsuccess = () => resolve(req.result);
    });
  }

  async function removePending(id) {
    const db = await openDB();
    return new Promise((resolve) => {
      const tx = db.transaction("pending", "readwrite");
      tx.objectStore("pending").delete(id);
      tx.oncomplete = resolve;
    });
  }

  // ========== قراءة الملف وتحويله Base64 ==========
  function fileToBase64(file) {
    return new Promise((resolve, reject) => {
      const reader = new FileReader();
      reader.onload = () => {
        const base64 = reader.result.split(",")[1];
        resolve({ name: file.name, type: file.type, data: base64 });
      };
      reader.onerror = reject;
      reader.readAsDataURL(file);
    });
  }

  // ========== إرسال النموذج ==========
  form.addEventListener("submit", async (e) => {
    e.preventDefault();
    submitBtn.disabled = true;
    submitBtn.textContent = "⏳ جاري الإرسال...";

    const fd = new FormData(form);
    const data = Object.fromEntries(fd);
    data.date = new Date().toLocaleDateString("ar-SA");
    data.time = new Date().toLocaleTimeString("ar-SA");

    // المرفق
    const fileInput = document.getElementById("attachment");
    if (fileInput.files.length > 0) {
      const file = fileInput.files[0];
      if (file.size > 5 * 1024 * 1024) {
        statusEl.textContent = "⚠️ حجم الملف أكبر من 5 ميجابايت";
        statusEl.className = "status err";
        submitBtn.disabled = false;
        submitBtn.textContent = "📤 إرسال التقرير";
        return;
      }
      try {
        data.attachment = await fileToBase64(file);
      } catch (err) {
        console.warn("فشل قراءة المرفق", err);
      }
    }

    // احفظ محليًا أولًا
    const localRecord = { ...data, _localId: Date.now() };
    await saveLocal(localRecord);

    // جرّب الإرسال
    try {
      const res = await fetch(API_URL, {
        method: "POST",
        body: JSON.stringify(data)
      });
      const json = await res.json();
      if (json.status === "ok") {
        const pending = await getPending();
        const match = pending.find(p => p._localId === localRecord._localId);
        if (match) await removePending(match.id);

        statusEl.textContent = "✅ تم إرسال التقرير بنجاح";
        statusEl.className = "status ok";
        form.reset();
      } else {
        throw new Error(json.message || "فشل الإرسال");
      }
    } catch (err) {
      statusEl.textContent = "⏳ لا يوجد إنترنت — تم الحفظ وسيُرسل تلقائيًا عند عودة الاتصال";
      statusEl.className = "status pending";
      form.reset();
    } finally {
      submitBtn.disabled = false;
      submitBtn.textContent = "📤 إرسال التقرير";
    }
  });

  // ========== مزامنة تلقائية ==========
  async function syncPending() {
    const pending = await getPending();
    for (const item of pending) {
      const { id, _localId, ...payload } = item;
      try {
        const res = await fetch(API_URL, { method: "POST", body: JSON.stringify(payload) });
        const json = await res.json();
        if (json.status === "ok") await removePending(id);
      } catch (e) { break; }
    }
  }

  window.addEventListener("online", syncPending);
  syncPending();

  if ("serviceWorker" in navigator) navigator.serviceWorker.register("sw.js");
</script>
</body>
</html>
